apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/darkodimkovski/argo-cd.git
    targetRevision: HEAD
    path: nodeapp
  destination:
    server: https://kubernetes.default.svc
    namespace: darkologija
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
  