apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.environment}}-{{.Release.Name}}-deployment
  labels:
    app: {{.Values.environment}}-{{.Release.Name}}
spec:
  replicas: {{.Values.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{.Values.environment}}-{{.Release.Name}}
  template:
    metadata:
      labels:
        app: {{.Values.environment}}-{{.Release.Name}}
        owner: {{.Values.owner | default "unknown" }}
        env: {{.Values.environment}}
    spec:
      containers:
        - name: k8s
          image: nigelpoulton/getting-started-k8s:1.0
          ports:
            - containerPort: 8080
