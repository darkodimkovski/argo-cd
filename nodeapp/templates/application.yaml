apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{.Values.environment}}-{{.Release.Name}}
  namespace: argocd
spec:
  project: {{.Values.argocd.project | default "default"}}
  source:
    repoURL: https://github.com/darkodimkovski/argo-cd.git
    targetRevision: HEAD
    path: . 
  destination:
    server: {{.Values.argocd.server | default "https://kubernetes.default.svc"}}
    namespace: {{.Values.argocd.namespace | default "default"}}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
  