apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: {{.Values.environment}}-{{.Release.Name}}-ingress
spec:
    rules:
    - host: guestbook.initgroup.mk
        http:
            paths:
            - path: /
                pathType: Prefix
                backend:
                    service:
                        name: {{.Values.environment}}-{{.Release.Name}}-svc
                        port:
                            number: 8080