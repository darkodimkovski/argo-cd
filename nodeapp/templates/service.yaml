apiVersion: v1
kind: Service
metadata:
  name: {{.Values.environment}}-{{.Release.Name}}-svc
spec:
  type: {{.Values.service.type | default "ClusterIP"}}
  selector:
    app: {{.Values.environment}}-{{.Release.Name}}
  ports:
    - protocol: TCP
      port: {{.Values.service.port | default 80}}
      targetPort: 80